name: Build MX Return Flow APK

on:
  push:
    branches:
      - mxreturn-flow-v040
    paths:
      - 'mx-return-flow/**'
      - '.github/workflows/build-mx-return-flow.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: mx-return-flow
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="mx-return-flow/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" MXReturn_v0.4.0_FLOW.apk
          sha256sum MXReturn_v0.4.0_FLOW.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MXReturn_v0.4.0_FLOW
          path: MXReturn_v0.4.0_FLOW.apk
          if-no-files-found: error
