name: AA AirPods OneApp2 - PUBLIC independent source tests
on:
  push:
    branches: [main]
    paths:
      - 'aa-airpods-independent/**'
      - '.github/workflows/aa-oneapp2-public-source-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-independent-golden-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile public Golden B decision logic and run repeated-cycle tests
        shell: bash
        run: |
          set -euo pipefail
          SRC=aa-airpods-independent/source
          ANDROID_SRC=aa-airpods-independent/aa-airpods-bridge-v01/app/src/main/java/com/aaairpods/bridge
          TEST=aa-airpods-independent/tests
          cmp "$SRC/OneApp2GoldenMechanics.java" "$ANDROID_SRC/OneApp2GoldenMechanics.java"
          mkdir -p "$RUNNER_TEMP/aa-oneapp2-public/classes" "$RUNNER_TEMP/aa-oneapp2-public/stub/com/aaairpods/bridge"
          javac --release 17 -d "$RUNNER_TEMP/aa-oneapp2-public/classes" \
            "$ANDROID_SRC/OneApp2GoldenMechanics.java" \
            "$SRC/OneApp2UniversalController.java" \
            "$SRC/OneApp2MediaOwnerSnapshot.java" \
            "$SRC/OneApp2RepeatFocusPlanner.java" \
            "$SRC/OneApp2IndependentCycleEngine.java" \
            "$TEST/OneApp2MediaOwnerSnapshotTest.java" \
            "$TEST/OneApp2RepeatFocusPlannerTest.java"
          java -cp "$RUNNER_TEMP/aa-oneapp2-public/classes" com.aaairpods.bridge.OneApp2MediaOwnerSnapshotTest
          java -cp "$RUNNER_TEMP/aa-oneapp2-public/classes" com.aaairpods.bridge.OneApp2RepeatFocusPlannerTest
          echo 'package com.aaairpods.bridge; public final class OneApp2Identity {public static final String APP_ID="com.aaairpods.oneapp.lab";}' > "$RUNNER_TEMP/aa-oneapp2-public/stub/com/aaairpods/bridge/OneApp2Identity.java"
          javac --release 17 -cp "$RUNNER_TEMP/aa-oneapp2-public/classes" -d "$RUNNER_TEMP/aa-oneapp2-public/classes" \
            "$RUNNER_TEMP/aa-oneapp2-public/stub/com/aaairpods/bridge/OneApp2Identity.java" \
            "$SRC/OneApp2IntegrationMatrix.java" \
            "$TEST/OneApp2IntegrationMatrixTest.java"
          java -cp "$RUNNER_TEMP/aa-oneapp2-public/classes" com.aaairpods.bridge.OneApp2IntegrationMatrixTest
      - name: Record exact public code build status
        shell: bash
        run: |
          printf 'SOURCE=PUBLIC_REPO\nPRIVATE_SOURCE_FETCH=NO\nTEST_LEVEL=HOST_ONLY\nANDROID_SIGNED_APK=NOT_BUILT\nVEHICLE_AUDIO=NOT_TESTED\n' > "$RUNNER_TEMP/AA_ONEAPP2_PUBLIC_HOST_STATUS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AA_ONEAPP2_PUBLIC_HOST_SOURCE_TESTS
          path: ${{ runner.temp }}/AA_ONEAPP2_PUBLIC_HOST_STATUS.txt
          retention-days: 7
