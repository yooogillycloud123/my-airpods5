name: AirPods5 case RPA source gate (no device)
on:
  push:
    branches: [airpods-personal-v111-updater-diagnostics]
    paths:
      - 'ci/case_protocol_v117/**'
      - '.github/workflows/case-protocol-v117-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kotlin-crypto-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install reproducible Kotlin 2.2.20 CLI
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip --output /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin-cli
          /tmp/kotlin-cli/kotlinc/bin/kotlinc -version
      - name: Compile source-driven case RPA matching algorithm and test
        run: |
          set -euo pipefail
          mkdir -p dist
          /tmp/kotlin-cli/kotlinc/bin/kotlinc ci/case_protocol_v117/CaseRpaIdentity.kt ci/case_protocol_v117/CaseRpaIdentityTest.kt -include-runtime -d dist/CaseRpaOfflineTests.jar
          java -cp dist/CaseRpaOfflineTests.jar caseproto.CaseRpaIdentityTest | tee dist/V117_VERIFICATION.txt
          grep -q 'SOURCE_BASED_OFFLINE_EIGHT_TESTS=PASS' dist/V117_VERIFICATION.txt
          if grep -E 'connectGatt|writeCharacteristic|startScan\(' ci/case_protocol_v117/CaseRpaIdentity.kt; then exit 3; fi
          sha256sum dist/CaseRpaOfflineTests.jar | tee dist/SHA256.txt
          echo 'CASE_SOUND_NOT_IMPLEMENTED=TRUE' >> dist/V117_VERIFICATION.txt
          echo 'NO_USER_DEVICE_TEST_REQUIRED=TRUE' >> dist/V117_VERIFICATION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CaseRpaIdentityOfflineV117
          path: dist/*
