name: AA Golden Capsule - FREE PUBLIC Runner (private source)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-aa-golden-capsule.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Approved private-source commit SHA (must match the pinned revision)'
        required: true
        default: 'dc743c551421936ca3ca6c5586494e85b56ea78e'
        type: string
permissions:
  contents: read
concurrency:
  group: aa-golden-original-signer
  cancel-in-progress: false
env:
  AA_EXPECTED_SOURCE_SHA: 'dc743c551421936ca3ca6c5586494e85b56ea78e'
  AA_ORIGINAL_SIGNING_SOURCE_SHA: '9ae4b5bf1472f28681f08c597ce50161d0176134'
  AA_EXPECTED_SIGNER_SHA256: 'be9ec29b5384912c2c75c283615ccc78ee17f694133375e087e8df08319e4f23'
jobs:
  build-original-signer:
    if: github.repository == 'yooogillycloud123/my-airpods5' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Verify only private source access token is configured
        env:
          AA_PRIVATE_SOURCE_PAT: ${{ secrets.AA_PRIVATE_SOURCE_PAT }}
          AA_REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$AA_REQUESTED_SOURCE_REF" ] && [ "$AA_REQUESTED_SOURCE_REF" != "$AA_EXPECTED_SOURCE_SHA" ]; then
            echo "::error title=UNAPPROVED_SOURCE_REVISION::Only the pinned source revision can be built."
            exit 41
          fi
          if [ -z "$AA_PRIVATE_SOURCE_PAT" ]; then
            echo "::error title=ONE_READONLY_TOKEN_REQUIRED::Add only AA_PRIVATE_SOURCE_PAT, scoped Contents:read to the TWO private repos. The existing keystore and signer configuration stay in the original private repository."
            exit 42
          fi
          echo "Private access configured; nothing sensitive printed."
      - name: Get exact Golden Capsule sources from PRIVATE repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yooogillycloud123/aa-airpods-golden-capsule
          ref: ${{ env.AA_EXPECTED_SOURCE_SHA }}
          token: ${{ secrets.AA_PRIVATE_SOURCE_PAT }}
          persist-credentials: false
          path: golden-src
      - name: Read original R25 signer from original PRIVATE repository (no new signing key)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yooogillycloud123/workexcel-devbridge
          ref: ${{ env.AA_ORIGINAL_SIGNING_SOURCE_SHA }}
          token: ${{ secrets.AA_PRIVATE_SOURCE_PAT }}
          persist-credentials: false
          path: signer-original
          sparse-checkout: |
            .github/signing
            .github/workflows/build-r2519-phonefix.yml
          sparse-checkout-cone-mode: false
      - name: Java 17 for Android 36
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 9.6.0 required by Android Gradle Plugin 9.4
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: true
      - name: Protect imported Golden exact blobs, owner constraints
        working-directory: golden-src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AA_EXPECTED_SOURCE_SHA"
          for check in qa/golden_capsule_migration_freeze.py qa/oneapp-controller/verify_golden_capsule_readonly.py qa/oneapp-controller/verify_embedded_golden_b.py; do
            if ! python3 "$check" >> "$RUNNER_TEMP/aa-private-source-checks.log" 2>&1; then
              echo "::error title=GOLDEN_SOURCE_CHECK_FAILED::The immutable-source gate failed. Private source diagnostics are not published."
              exit 44
            fi
          done
          if ! python3 qa/oneapp-controller/verify_oneapp2_internal_direct_parity.py >> "$RUNNER_TEMP/aa-private-source-checks.log" 2>&1; then
            echo "::error title=ONEAPP2_INTERNAL_ROUTE_STATIC_FAILED::New daemon/direct/edge roles are not fully integrated or safe."
            exit 57
          fi
          echo "Pinned private source, Golden immutables and integrated OneApp2 checks passed."
      - name: Verify existing PRIVATE Android executable class closure without public source migration
        working-directory: golden-src
        shell: bash
        run: |
          set -euo pipefail
          SRC=aa-airpods-bridge-v01/app/src/main/java/com/aaairpods/bridge
          for class in OneApp2UniversalController OneApp2LiveOutputObserver; do
            test -s "$SRC/$class.java" || {
              echo "::error title=PRIVATE_ANDROID_SOURCE_MISSING::$class absent in the original complete source."
              exit 59
            }
            echo "PRIVATE_ANDROID_CLASS_PRESENT=$class"
          done
          echo 'ANDROID_EXECUTABLE_CLASS_CLOSURE=PASS_FROM_EXISTING_PRIVATE_SOURCE'
          echo 'NO_CLASS_COPIES_TO_PUBLIC=YES'
      - name: Immutable focus lifecycle host regression
        working-directory: golden-src
        shell: bash
        run: |
          set -euo pipefail
          SRC=aa-airpods-bridge-v01/app/src/main/java/com/aaairpods/bridge
          mkdir -p "$RUNNER_TEMP/focus_host"
          if ! {
            javac --release 17 -d "$RUNNER_TEMP/focus_host" "$SRC/OneApp2GoldenMechanics.java" "$SRC/OneApp2UniversalController.java" "$SRC/OneApp2MediaOwnerSnapshot.java" "$SRC/OneApp2RepeatFocusPlanner.java" qa/oneapp-controller/OneApp2RepeatFocusPlannerTest.java &&
            java -cp "$RUNNER_TEMP/focus_host" com.aaairpods.bridge.OneApp2RepeatFocusPlannerTest
          } > "$RUNNER_TEMP/aa-private-focus-tests.log" 2>&1; then
            echo "::error title=FOCUS_HOST_CHECK_FAILED::Golden focus host regression failed; private diagnostics are not published."
            exit 45
          fi
          echo "Golden focus host regression passed."
      - name: Independent OneApp2 native role matrix JDK17 regression
        working-directory: golden-src
        shell: bash
        run: |
          set -euo pipefail
          SRC=aa-airpods-bridge-v01/app/src/main/java/com/aaairpods/bridge
          TDIR="$RUNNER_TEMP/oneapp2_host"
          mkdir -p "$TDIR/src/com/aaairpods/bridge" "$TDIR/classes"
          # Match exact independent flavor APP_ID from the untouched real source;
          # use a test-only identity stub to keep the audit free of Android deps.
          grep -Fq 'APP_ID="com.aaairpods.oneapp.lab"' "$SRC/OneApp2Identity.java"
          printf 'package com.aaairpods.bridge; public final class OneApp2Identity { public static final String APP_ID="com.aaairpods.oneapp.lab"; }\n' > "$TDIR/src/com/aaairpods/bridge/OneApp2Identity.java"
          if ! {
            javac --release 17 -d "$TDIR/classes" "$TDIR/src/com/aaairpods/bridge/OneApp2Identity.java" "$SRC/OneApp2IntegrationMatrix.java" qa/oneapp-controller/OneApp2IntegrationMatrixTest.java
            java -cp "$TDIR/classes" com.aaairpods.bridge.OneApp2IntegrationMatrixTest
          } > "$RUNNER_TEMP/aa-private-oneapp2-role-tests.log" 2>&1; then
            echo "::error title=ONEAPP2_ROLE_MATRIX_FAILED::Independent host parity checks failed; no Golden audio action attempted."
            exit 56
          fi
          echo "ONEAPP2_STANDALONE_ROLE_MATRIX_HOST=PASS"
      - name: Install Android 36 SDK, NDK 27, CMake 3.22 and compile-only stubs
        working-directory: golden-src
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'cmake;3.22.1' 'ndk;27.0.12077973'
          mkdir -p "$RUNNER_TEMP/classes"
          javac --release 17 -cp "$ANDROID_HOME/platforms/android-36/android.jar" -d "$RUNNER_TEMP/classes" r25-hidden-stubs/android/media/AudioFocusInfo.java r25-hidden-stubs/android/media/audiopolicy/AudioPolicy.java
          jar cf aa-airpods-bridge-v01/r25-hidden-api-stubs.jar -C "$RUNNER_TEMP/classes" .
      - name: Compile exact v26080 AA Golden Capsule production source
        working-directory: golden-src
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle -p aa-airpods-bridge-v01 :app:compileProductionDebugJavaWithJavac --no-daemon --stacktrace > "$RUNNER_TEMP/aa-private-compile.log" 2>&1; then
            category=UNKNOWN
            if grep -Eq 'Could not resolve|Could not find .*:[0-9]|Failed to resolve' "$RUNNER_TEMP/aa-private-compile.log"; then category=DEPENDENCY_RESOLUTION;
            elif grep -Eq 'error:|Compilation failed|compileProductionDebugJavaWithJavac FAILED' "$RUNNER_TEMP/aa-private-compile.log"; then category=JAVA_COMPILATION;
            elif grep -Eq 'SDK location not found|Failed to find Build Tools|Android SDK' "$RUNNER_TEMP/aa-private-compile.log"; then category=ANDROID_SDK;
            elif grep -Eq 'Could not determine java version|Unsupported class file major version' "$RUNNER_TEMP/aa-private-compile.log"; then category=JAVA_GRADLE_VERSION;
            fi
            echo "::error title=PRIVATE_SOURCE_COMPILE_FAILED::Android compile failed. CATEGORY=$category. Private source, signing material and raw build log are not published."
            exit 46
          fi
          echo "Exact production Java compilation passed."
      - name: Verify original signer source SHA and restricted private files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C signer-original rev-parse HEAD)" = "$AA_ORIGINAL_SIGNING_SOURCE_SHA"
          test "$(git -C signer-original hash-object .github/signing/aa-airpods-stable.jks.b64)" = "32affbb045da36a6eb4856f28fee8bda0c76aca2"
          test -s signer-original/.github/signing/aa-airpods-stable.jks.b64
          test -s signer-original/.github/workflows/build-r2519-phonefix.yml
          echo "Existing original private signing material present; no new key created."
      - name: Build production with original private R25 signing identity, verify certificate
        working-directory: golden-src
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export AA_SIGN_STORE="$RUNNER_TEMP/aa-r25-original.jks"
          CONF="$RUNNER_TEMP/aa-private-signing-env.sh"
          trap 'rm -f -- "$AA_SIGN_STORE" "$CONF"' EXIT
          base64 -d ../signer-original/.github/signing/aa-airpods-stable.jks.b64 > "$AA_SIGN_STORE"
          chmod 600 "$AA_SIGN_STORE"
          # The old PRIVATE branch already contains the original signing env;
          # parse ONLY the three known scalar values without printing any secret.
          python3 - <<'PY' > "$CONF"
          from pathlib import Path
          import re, shlex
          source=Path("../signer-original/.github/workflows/build-r2519-phonefix.yml").read_text()
          for key in ("AA_SIGN_STORE_PASS","AA_SIGN_KEY_ALIAS","AA_SIGN_KEY_PASS"):
              matches=re.findall(r"(?m)^\s*"+re.escape(key)+r":\s*(\S+)\s*$",source)
              if len(matches)!=1 or not matches[0] or (chr(36)+chr(123)+chr(123)) in matches[0]:
                  raise SystemExit("PRIVATE_SIGNING_CONFIG_INVALID_"+key)
              print("export "+key+"="+shlex.quote(matches[0]))
          PY
          chmod 600 "$CONF"
          # shellcheck disable=SC1090
          source "$CONF"
          cert_sha="$(keytool -exportcert -keystore "$AA_SIGN_STORE" -alias "$AA_SIGN_KEY_ALIAS" -storepass:env AA_SIGN_STORE_PASS 2> "$RUNNER_TEMP/aa-private-keytool.log" | sha256sum | cut -d' ' -f1)"
          if [ "$cert_sha" != "$AA_EXPECTED_SIGNER_SHA256" ]; then
            echo "::error title=WRONG_ORIGINAL_SIGNER::Existing private key does not match installed R25 signer."
            exit 47
          fi
          if ! gradle -p aa-airpods-bridge-v01 :app:assembleProductionDebug --no-daemon --stacktrace > "$RUNNER_TEMP/aa-private-signed-build.log" 2>&1; then
            echo "::error title=SIGNED_BUILD_FAILED::The private production build failed; no sensitive diagnostics published."
            exit 48
          fi
          APK=aa-airpods-bridge-v01/app/build/outputs/apk/production/debug/app-production-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signer.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-signer.txt"
          grep -Fqi 'be9ec29b5384912c2c75c283615ccc78ee17f694133375e087e8df08319e4f23' "$RUNNER_TEMP/apk-signer.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='com.aaairpods.r25fix'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionCode='26080'" "$RUNNER_TEMP/badging.txt"
          if ! python3 qa/golden_capsule_verify_apk.py "$APK" > "$RUNNER_TEMP/aa-private-apk-check.log" 2>&1; then
            echo "::error title=APK_INTEGRITY_FAILED::Golden integrity audit failed."
            exit 49
          fi
          mkdir -p dist
          cp "$APK" dist/AA_AirPods_v26080_ORIGINAL_SIGNED_READONLY_CANDIDATE_NOT_FINAL.apk
          # Separate independently installable OneApp2 LAB application: original Golden
          # production package, helper packages, daemon and data remain untouched.
          if ! gradle -p aa-airpods-bridge-v01 :app:assembleLabDebug --no-daemon --stacktrace > "$RUNNER_TEMP/aa-private-lab-compile.log" 2>&1; then
            echo "::error title=INDEPENDENT_LAB_BUILD_FAILED::New parallel-install LAB APK compilation failed."
            exit 50
          fi
          LAB=aa-airpods-bridge-v01/app/build/outputs/apk/lab/debug/app-lab-debug.apk
          test -s "$LAB"
          unzip -t "$LAB" > "$RUNNER_TEMP/aa-private-lab-zip-check.log"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$LAB" > "$RUNNER_TEMP/aa-private-lab-sign-check.log"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/aa-private-lab-sign-check.log"
          grep -Fqi "$AA_EXPECTED_SIGNER_SHA256" "$RUNNER_TEMP/aa-private-lab-sign-check.log"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$LAB" > "$RUNNER_TEMP/aa-private-lab-badging.log"
          grep -Fq "package: name='com.aaairpods.oneapp.lab'" "$RUNNER_TEMP/aa-private-lab-badging.log"
          grep -Fq "versionCode='26080'" "$RUNNER_TEMP/aa-private-lab-badging.log"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$LAB" AndroidManifest.xml > "$RUNNER_TEMP/aa-private-lab-manifest.log"
          grep -Fq 'OneAppLabActivity' "$RUNNER_TEMP/aa-private-lab-manifest.log"
          if grep -Eq 'com[.]aaairpods[.]r25fix[.](verifiedupdates|controllermode)' "$RUNNER_TEMP/aa-private-lab-manifest.log"; then
            echo "::error title=LAB_MANIFEST_PROTECT_GOLDEN::Cannot install parallel LAB with original R25 provider authorities."
            exit 51
          fi
          python3 qa/golden_capsule_verify_apk.py "$LAB" > "$RUNNER_TEMP/aa-private-lab-integrity.log"
          cp "$LAB" dist/AA_OneApp2_Independent_v26080_SIGNED_LAB_NOT_FINAL.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          printf 'CODE=BUILT STATIC=PASS VEHICLE=NOT_TESTED CAPSULE_HELPER_MANAGER=NOT_IMPLEMENTED\\n' > dist/BUILD_STATUS.txt
      - name: Upload verified signed candidate (never publish private source)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AA_ONEAPP2_AND_R25_v26080_SIGNED_LAB_NOT_FINAL
          path: |
            golden-src/dist/AA_AirPods_v26080_ORIGINAL_SIGNED_READONLY_CANDIDATE_NOT_FINAL.apk
            golden-src/dist/AA_OneApp2_Independent_v26080_SIGNED_LAB_NOT_FINAL.apk
            golden-src/dist/SHA256SUMS.txt
            golden-src/dist/BUILD_STATUS.txt
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary signing material and private diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/aa-r25-original.jks" "$RUNNER_TEMP/aa-private-source-checks.log" "$RUNNER_TEMP/aa-private-focus-tests.log" "$RUNNER_TEMP/aa-private-compile.log" "$RUNNER_TEMP/aa-private-keytool.log" "$RUNNER_TEMP/aa-private-signed-build.log" "$RUNNER_TEMP/aa-private-apk-check.log" "$RUNNER_TEMP/aa-private-lab-compile.log" "$RUNNER_TEMP/aa-private-lab-zip-check.log" "$RUNNER_TEMP/aa-private-lab-sign-check.log" "$RUNNER_TEMP/aa-private-lab-badging.log" "$RUNNER_TEMP/aa-private-lab-manifest.log" "$RUNNER_TEMP/aa-private-lab-integrity.log"
