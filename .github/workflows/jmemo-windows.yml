name: JMemo Personal - Build EXE and REA proof
on:
  push:
    branches: [jmemo-personal-free-runner]
    paths:
      - 'jmemo-personal/**'
      - '.github/workflows/jmemo-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: jmemo-personal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Storage regression tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone EXE
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name JMemo_Personal src/jmemo.py
      - name: EXE integrity
        shell: pwsh
        run: |
          $p = "dist/JMemo_Personal.exe"
          if (!(Test-Path $p)) { throw "EXE missing" }
          $bytes = [IO.File]::ReadAllBytes($p)
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "Bad PE/MZ header" }
          Get-FileHash $p -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: JMemo_Personal_Windows_EXE
          path: jmemo-personal/dist/JMemo_Personal.exe
          if-no-files-found: error
          retention-days: 7
  rea-artifact-audit:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JMemo_Personal_Windows_EXE
          path: analysis-target
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Install REA CLI for static PE audit
        run: npm install --global rea-agents@6.5.0
      - name: REA Windows EXE static evidence (capture exact failures)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $hash = (Get-FileHash analysis-target/JMemo_Personal.exe -Algorithm SHA256).Hash
          "target_sha256=$hash" | Out-File -Encoding UTF8 evidence/artifact-identity.txt
          $ErrorActionPreference = "Continue"
          & rea --version *> evidence/rea-version.log
          $v = $LASTEXITCODE
          & rea doctor --json *> evidence/rea-doctor.log
          $d = $LASTEXITCODE
          & rea inspect-pe-resources analysis-target/JMemo_Personal.exe --json *> evidence/pe-resources.log
          $r = $LASTEXITCODE
          "version=$v doctor=$d resources=$r" | Tee-Object -FilePath evidence/exit-codes.txt
          Get-Content evidence/rea-version.log | Select-Object -First 12
          Get-Content evidence/pe-resources.log | Select-Object -First 32
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: JMemo_REA_Static_Analysis
          path: evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Enforce actual REA result
        shell: pwsh
        run: |
          $s = Get-Content evidence/exit-codes.txt -Raw
          if ($s -notmatch "version=0" -or $s -notmatch "resources=0") {
            throw "REA PE audit failed. Read JMemo_REA_Static_Analysis logs; no REA PASS claim."
          }
