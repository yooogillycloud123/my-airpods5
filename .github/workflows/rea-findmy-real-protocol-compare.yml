name: REA actual Find My protocol APK comparison (AirGuard OSS)
on:
  workflow_dispatch:
  push:
    branches: [main, feature/rea-real-findmy-comparative-audit-20261016, fix/case-model-proof-rea-20261017]
    paths:
      - 'tools/rea_airpods/compare_findmy_oss.py'
      - 'tools/rea_airpods/test_compare_findmy_oss.py'
      - 'tools/rea_airpods/airguard_sound_semantics.py'
      - 'tools/rea_airpods/test_airguard_sound_semantics.py'
      - 'tools/rea_airpods/case_target_identity.py'
      - 'tools/rea_airpods/test_case_target_identity.py'
      - '.github/workflows/rea-findmy-real-protocol-compare.yml'
permissions:
  contents: read
jobs:
  actual-rea-findmy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AIRGUARD_VERSION: '3.1.3'
      AIRGUARD_SHA256: 6fd3e5d1c3c1255f44ac29ed27e50fba760180dcdc4f452d7560c1e28ca12a93
      JADX_JAR_SHA256: 6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75
      REA_JADX_HEAP_MIB: '2048'
      REA_JADX_ACTIVE_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit tests without devices
        run: python3 -m unittest discover -s tools/rea_airpods -p 'test_compare_findmy_oss.py' -v
      - name: Fail-closed device model verification vs conflicting Apple official sources
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools/rea_airpods python3 -m unittest discover -s tools/rea_airpods -p 'test_case_target_identity.py' -v
          python3 tools/rea_airpods/case_target_identity.py --out "dist/REA_AirPods5_CASE_MODEL_IDENTITY_GATE.json"
          python3 -m json.tool dist/REA_AirPods5_CASE_MODEL_IDENTITY_GATE.json > /dev/null
          cat dist/REA_AirPods5_CASE_MODEL_IDENTITY_GATE.json
      - name: Install official pinned REA 6.5.0
        run: |
          set -euo pipefail
          ps -p $$
          npm install --global rea-agents@6.5.0 --no-audit --no-fund
          rea --version
      - name: Verify official upstream REA JADX JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea-jadx"
          curl --retry 3 -fsSL \
            https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar \
            -o "$RUNNER_TEMP/rea-jadx/jadx-headless-mcp-0.7.1-all.jar"
          printf '%s  %s\n' "$JADX_JAR_SHA256" "$RUNNER_TEMP/rea-jadx/jadx-headless-mcp-0.7.1-all.jar" | sha256sum -c -
          echo "REA_JADX_MCP_JAR=$RUNNER_TEMP/rea-jadx/jadx-headless-mcp-0.7.1-all.jar" >> "$GITHUB_ENV"
          java --list-modules | grep -F jdk.compiler
      - name: Fetch public GPL AirGuard release 3.1.3 and verify official release digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea-opensource"
          curl --retry 3 -fsSL \
            "https://github.com/seemoo-lab/AirGuard/releases/download/3.1.3/AirGuard.3.1.3.Github.apk" \
            -o "$RUNNER_TEMP/rea-opensource/AirGuard.3.1.3.Github.apk"
          printf '%s  %s\n' "$AIRGUARD_SHA256" "$RUNNER_TEMP/rea-opensource/AirGuard.3.1.3.Github.apk" | sha256sum -c -
          echo "REA_PUBLIC_OSS_APK=$RUNNER_TEMP/rea-opensource/AirGuard.3.1.3.Github.apk" >> "$GITHUB_ENV"
      - name: Real JADX decompile with REA and generate privacy-safe CASE protocol verdict
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools/rea_airpods python3 tools/rea_airpods/compare_findmy_oss.py \
            --apk "$REA_PUBLIC_OSS_APK" \
            --sha256 "$AIRGUARD_SHA256" \
            --output "dist/REA_AirGuard_FindMy_CASE_OWNERSHIP_STATUS.json"
          python3 -m json.tool dist/REA_AirGuard_FindMy_CASE_OWNERSHIP_STATUS.json >/dev/null
          cat dist/REA_AirGuard_FindMy_CASE_OWNERSHIP_STATUS.json
      - name: Prove exact public-source BLE mask and FD44 nonowner control against upstream 3.1.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea-airguard-src"
          BASE="https://raw.githubusercontent.com/seemoo-lab/AirGuard/3.1.3/app/src/main/java/de/seemoo/at_tracking_detection/database/models/device/types"
          curl --retry 3 -fsSL "$BASE/AirPods.kt" -o "$RUNNER_TEMP/rea-airguard-src/AirPods.kt"
          curl --retry 3 -fsSL "$BASE/AppleFindMy.kt" -o "$RUNNER_TEMP/rea-airguard-src/AppleFindMy.kt"
          python3 tools/rea_airpods/airguard_sound_semantics.py \
            --airpods "$RUNNER_TEMP/rea-airguard-src/AirPods.kt" \
            --applefindmy "$RUNNER_TEMP/rea-airguard-src/AppleFindMy.kt" \
            --output "dist/REA_AirGuard_3.1.3_VERIFIED_SOUND_CONTRACT.json"
          cat dist/REA_AirGuard_3.1.3_VERIFIED_SOUND_CONTRACT.json
      - name: Publish only sanitized source evidence (no APK or raw decompile)
        uses: actions/upload-artifact@v4
        with:
          name: REA_FindMy_v139_vs_AirGuard_SOURCE_EVIDENCE
          path: |
            dist/REA_AirGuard_FindMy_CASE_OWNERSHIP_STATUS.json
            dist/REA_AirGuard_3.1.3_VERIFIED_SOUND_CONTRACT.json
            dist/REA_AirPods5_CASE_MODEL_IDENTITY_GATE.json
          retention-days: 7
