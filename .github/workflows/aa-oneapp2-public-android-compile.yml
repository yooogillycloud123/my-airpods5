name: AA OneApp2 - PUBLIC Android source compile
on:
  push:
    branches: [main]
    paths:
      - 'aa-airpods-independent/aa-airpods-bridge-v01/**'
      - '.github/workflows/aa-oneapp2-public-android-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.0'
          cache-disabled: true
      - name: Verify actual Android source closure before downloading SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("aa-airpods-independent/aa-airpods-bridge-v01/app/src/main/java/com/aaairpods/bridge")
          # These are referenced by the real Android app; a host-only copy
          # outside app/src/main/java is NOT a compilable Android implementation.
          required={
            "OneApp2UniversalController.java":("OneApp2IndependentCycleEngine.java","OneApp2RoutingAdapter.java"),
            "OneApp2LiveOutputObserver.java":("OneAppLabActivity.java","OneApp2IndependentEventCoordinator.java"),
          }
          missing=[]
          for filename,callers in required.items():
              path=src/filename
              if not path.is_file():
                  missing.append(filename)
                  print(f"ANDROID_JAVA_MISSING={filename} REFERENCED_BY={','.join(callers)}")
              else:
                  print(f"ANDROID_JAVA_PRESENT={filename}")
          if missing:
              print(f"PUBLIC_ANDROID_SOURCE_CLOSURE=FAIL missing_distinct_classes={len(missing)}")
              print("HOST_JAVA_PASS_IS_NOT_ANDROID_COMPILE_PASS")
              print("APK_NOT_BUILT=YES")
              raise SystemExit(1)
          print("PUBLIC_ANDROID_SOURCE_CLOSURE=PASS")
          PY
      - name: Install public Android build SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             'platforms;android-36' 'build-tools;36.0.0'             'platform-tools' 'cmake;3.22.1' 'ndk;27.0.12077973'
      - name: Compile independent Android LAB Java from public repository only
        shell: bash
        run: |
          set -uo pipefail
          ROOT=aa-airpods-independent/aa-airpods-bridge-v01
          mkdir -p "$RUNNER_TEMP/oneapp2"
          set +e
          gradle -p "$ROOT" :app:compileLabDebugJavaWithJavac --no-daemon > "$RUNNER_TEMP/oneapp2/gradle.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error title=PUBLIC_ANDROID_SOURCE_COMPILE_FAILED::Source is incomplete or build setup failed. No APK built."
            echo '---- bounded public Gradle error summary ----'
            grep -E -m 32 '(error:|^> Task .* FAILED|^\\* What went wrong:|^  Could not|^> Could not|^Could not|^FAILURE:|^> Plugin|^> No matching|^> Cannot|^\\s*Caused by:)' "$RUNNER_TEMP/oneapp2/gradle.log" || true
            tail -n 16 "$RUNNER_TEMP/oneapp2/gradle.log" | sed -E 's#(/home/runner/)[^ ]+#<RUNNER_PATH>#g'
            exit "$result"
          fi
          echo 'PUBLIC_ANDROID_JAVA_COMPILE=PASS'
          echo 'AUDIO_FOCUS_UID_PARITY=UNVERIFIED'
          echo 'ANDROID_SOURCE_COMPILE=PASS: proceeding to isolated LAB packaging'
      - name: Assemble separately installable LAB and verify package/ZIP/signature
        shell: bash
        run: |
          set -euo pipefail
          ROOT=aa-airpods-independent/aa-airpods-bridge-v01
          gradle -p "$ROOT" :app:assembleLabDebug --no-daemon > "$RUNNER_TEMP/oneapp2/assemble.log" 2>&1 || {
            echo '::error title=ISOLATED_LAB_ASSEMBLE_FAILED::No signed artifact from this run.'
            grep -E -m 24 '(error:| FAILED|FAILURE:|What went wrong:)' "$RUNNER_TEMP/oneapp2/assemble.log" || true
            exit 1
          }
          APK="$ROOT/app/build/outputs/apk/lab/debug/app-lab-debug.apk"
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/oneapp2/signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/oneapp2/signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/oneapp2/badging.txt"
          grep -Fq "package: name='com.aaairpods.oneapp.lab'" "$RUNNER_TEMP/oneapp2/badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/oneapp2/manifest.txt"
          grep -Fq 'OneAppLabActivity' "$RUNNER_TEMP/oneapp2/manifest.txt"
          if grep -Eq 'com[.]aaairpods[.]r25fix[.](verifiedupdates|controllermode)' "$RUNNER_TEMP/oneapp2/manifest.txt"; then
            echo '::error title=LAB_AUTHORITY_COLLISION::Original Golden provider authority leaked into the separate LAB.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/oneapp2/output"
          cp "$APK" "$RUNNER_TEMP/oneapp2/output/AA_OneApp2_PUBLIC_LAB_COMPILED_NOT_CAR_VERIFIED.apk"
          sha256sum "$APK" | sed 's# .*$#  AA_OneApp2_PUBLIC_LAB_COMPILED_NOT_CAR_VERIFIED.apk#' > "$RUNNER_TEMP/oneapp2/output/SHA256SUMS.txt"
          printf 'SOURCE_HEAD=%s\nPACKAGE=com.aaairpods.oneapp.lab\nSIGNER=LAB_DEBUG_OR_AUTHORIZED_EXISTING_SIGNER\nVEHICLE_AUDIO=UNVERIFIED\nEXTERNAL_GENERIC_FOCUS=UNVERIFIED\nGOLDEN_CONTROL_NOT_ACCESSED=YES\n' "$GITHUB_SHA" > "$RUNNER_TEMP/oneapp2/output/BUILD_STATUS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AA_ONEAPP2_PUBLIC_COMPILED_LAB_NOT_FINAL
          path: ${{ runner.temp }}/oneapp2/output/
          retention-days: 7
