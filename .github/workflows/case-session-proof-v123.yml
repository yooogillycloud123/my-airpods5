name: Case Session Proof v123 - synthetic HCI regression only
on:
  push:
    branches: [airpods-case-session-proof-v123-20261015]
    paths: ['ci/case_protocol_v123/**', '.github/workflows/case-session-proof-v123.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v119 parser baseline and v123 session provenance
        run: |
          set -euo pipefail
          python3 ci/case_protocol_v119/test_extract_att_hci.py
          python3 ci/case_protocol_v119/test_uuid_map.py
          python3 ci/case_protocol_v123/test_case_session_evidence.py
          python3 -m py_compile ci/case_protocol_v123/*.py
          ! grep -En 'startScan\(|connectGatt|writeCharacteristic' ci/case_protocol_v123/*.py
          echo 'V123_OFFLINE_REGRESSION=PASS'
          echo 'AIRPODS5_CASE_SOUND=NOT_IMPLEMENTED_NOT_VERIFIED'
