name: My AirPods 5 - FREE public GitHub source APK build
on:
  workflow_dispatch:
  push:
    branches: [main, airpods-personal-v111-updater-diagnostics]
    paths:
      - ".github/workflows/build-my-airpods5.yml"
      - "My_AirPods5_Clean_Standalone_Korean_SourceBuild_20261014-2.zip"
      - "ci/repair_personal_core_v104.py"
      - "ci/repair_personal_core_v105.py"
      - "ci/repair_personal_ui_v106.py"
      - "ci/repair_personal_activity_v107.py"
      - "ci/repair_personal_oneear_v108.py"
      - "ci/add_personal_diagnostics_v109.py"
      - "ci/fix_evidenced_videoview_badtoken_v110.py"
      - "ci/patch_personal_v111_updater_logs.py"
      - "ci/PersonalUpdateManager_v111.kt"
      - "ci/CaseSpeakerLab_v112.kt"
      - "ci/patch_v112.py"
      - "ci/Capture-MyAirPods5-SystemCrash.ps1"
permissions:
  contents: write
jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify original source archive, exact checksum and GPL license
        run: |
          set -euo pipefail
          FILE=My_AirPods5_Clean_Standalone_Korean_SourceBuild_20261014-2.zip
          echo "0403d20dcc83ae02a974d69b1340e5686ac408b43f77e341e2068fe9991829da  $FILE" | sha256sum -c -
          unzip -t "$FILE" | tail -1
          unzip -q "$FILE" -d input
          test -s input/app_source/LICENSE
          grep -F 'applicationId = "com.myairpods5.personal"' input/app_source/android/app/build.gradle.kts
      - name: Restore verified original AACP engine; patch real VideoView BadToken crash
        shell: bash
        run: |
          set -euo pipefail
          SRC=input/app_source/android/app/src/main/java/me/kavishdevar/librepods
          cp "$SRC/MainActivity.kt" input/PRISTINE_MainActivity.kt
          find "$SRC/bluetooth" "$SRC/services" "$SRC/data" "$SRC/receivers" -type f -name '*.kt' ! -name 'AirPodsService.kt' -print0 | sort -z | xargs -0 sha256sum > input/PRISTINE_ENGINE_SHA256.txt
          # Application installs the forensics exception handler; its SHA is intentionally changed.
          python3 ci/repair_korean_onboarding_and_service.py input/app_source
          cp input/PRISTINE_MainActivity.kt "$SRC/MainActivity.kt"
          python3 ci/repair_personal_ui_v106.py input/app_source
          python3 ci/repair_personal_activity_v107.py input/app_source
          python3 ci/repair_personal_oneear_v108.py input/app_source
          python3 ci/add_personal_diagnostics_v109.py input/app_source
          python3 ci/fix_evidenced_videoview_badtoken_v110.py input/app_source
          python3 ci/patch_personal_v111_updater_logs.py input/app_source "$PWD"
          python3 ci/patch_v112.py input/app_source "$PWD"
          python3 -m py_compile ci/add_personal_diagnostics_v109.py ci/fix_evidenced_videoview_badtoken_v110.py
          test -s input/app_source/android/app/src/main/java/me/kavishdevar/librepods/AirPodsCrashDiary.kt
          sha256sum -c input/PRISTINE_ENGINE_SHA256.txt
          grep -F 'versionCode = 10012'
          grep -F 'applicationId = "com.myairpods5.personal.lab"' input/app_source/android/app/build.gradle.kts input/app_source/android/app/build.gradle.kts
          ! grep -F 'android.resource://me.kavishdevar.librepods' "$SRC/presentation/overlays/PopupWindow.kt" "$SRC/presentation/overlays/IslandWindow.kt"
          grep -F 'setOnErrorListener' "$SRC/presentation/overlays/PopupWindow.kt" "$SRC/presentation/overlays/IslandWindow.kt"
          echo 'REAL_BADTOKEN_VIDEO_URI_AND_HANDLER=PASS'
          echo "AUDITED_SINGLE_BIND_LIFECYCLE=PASS"
          ! grep -F 'Last updated: 20 June 2026' "$SRC/presentation/screens/onboarding/PrivacyPolicyPage.kt"
          echo "PRISTINE_BLUETOOTH_AACP_ATT_BLE_ALL_OTHER_SERVICES_BYTE_FOR_BYTE=PASS"
          echo "AIRPODSSERVICE_EXACT_4_NULL_GUARDS_ONLY=PASS"
      - name: Install supported Android 36 SDK / NDK 28
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "sdk.dir=${ANDROID_HOME}" > input/app_source/android/local.properties
      - name: Use persistent private signing key ONLY when secured GitHub secrets exist
        env:
          AIRPODS_SIGNER_BASE64: ${{ secrets.AIRPODS_SIGNER_BASE64 }}
          AIRPODS_SIGNER_STORE_PASSWORD: ${{ secrets.AIRPODS_SIGNER_STORE_PASSWORD }}
          AIRPODS_SIGNER_KEY_ALIAS: ${{ secrets.AIRPODS_SIGNER_KEY_ALIAS }}
          AIRPODS_SIGNER_KEY_PASSWORD: ${{ secrets.AIRPODS_SIGNER_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${AIRPODS_SIGNER_BASE64}" ] && [ -n "${AIRPODS_SIGNER_STORE_PASSWORD}" ] && [ -n "${AIRPODS_SIGNER_KEY_ALIAS}" ] && [ -n "${AIRPODS_SIGNER_KEY_PASSWORD}" ]; then
            umask 077
            mkdir -p input/app_source/android/.secure-local
            printf '%s' "${AIRPODS_SIGNER_BASE64}" | base64 -d > input/app_source/android/.secure-local/airpods-personal.jks
            chmod 600 input/app_source/android/.secure-local/airpods-personal.jks
            {
              printf '%s\n' 'RELEASE_STORE_FILE=.secure-local/airpods-personal.jks'
              printf 'RELEASE_STORE_PASSWORD=%s\n' "${AIRPODS_SIGNER_STORE_PASSWORD}"
              printf 'RELEASE_KEY_ALIAS=%s\n' "${AIRPODS_SIGNER_KEY_ALIAS}"
              printf 'RELEASE_KEY_PASSWORD=%s\n' "${AIRPODS_SIGNER_KEY_PASSWORD}"
            } >> input/app_source/android/local.properties
            echo "STABLE_SIGNING=READY" > input/SIGNING_STATE.txt
            echo "Stable key loaded from private GitHub Actions secrets; keystore contents not printed."
          else
            echo "STABLE_SIGNING=NOT_CONFIGURED" > input/SIGNING_STATE.txt
            echo "::warning::Long-term signature missing; LAB APK cannot be an in-place update over r21 GOLDEN."
          fi
      - name: Compile LibrePods-derived independent Korean APK from source
        working-directory: input/app_source/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleFossDebug -x :app:checkFossDebugAarMetadata --no-daemon --stacktrace --console=plain --max-workers=2
      - name: Verify APK and signer
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE=input/app_source/android/app/build/outputs/apk/foss/debug/app-foss-debug.apk
          test -s "$SOURCE"
          APK=dist/My_AirPods5_v1.0.12_CASE_SOUND_RESEARCH_LAB.apk
          cp "$SOURCE" "$APK"
          unzip -t "$APK" | tail -1
          # Verify the DEX, not merely source text, actually contains the crash recorder.
          unzip -p "$APK" 'classes*.dex' | LC_ALL=C grep -aF "AirPodsCrashDiary" >/dev/null
          unzip -p "$APK" 'classes*.dex' | LC_ALL=C grep -aF "airpods_last_fatal.txt" >/dev/null
          echo "APK_DIAGNOSTIC_CRASH_RECORDER_IN_DEX=PASS"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep '^package:' | tee dist/PACKAGE.txt
          grep -F "name='com.myairpods5.personal.lab'" dist/PACKAGE.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/SIGNATURE.txt
          sha256sum "$APK" | tee dist/SHA256.txt
          cp input/app_source/LICENSE dist/GPL_LICENSE.txt
          echo "v1.0.11 ISOLATED BETA: base r21 golden protocol frozen; adds Settings update check and local crash logs, removes startup popup. SHA256/certificate/package verified before APK installer. No stable signing configured on CI: THIS APK CANNOT UPDATE INSTALLED GOLDEN r21 IN PLACE. Never uninstall user-verified r21 to test a beta. Physical regression unknown. Charging-case find-my beep NOT implemented." > dist/DEVICE_TEST_REQUIRED.txt
          cp ci/Capture-MyAirPods5-SystemCrash.ps1 dist/
          cp input/PRISTINE_ENGINE_SHA256.txt dist/PRISTINE_ENGINE_SHA256.txt
          cp input/SIGNING_STATE.txt dist/SIGNING_STATE.txt
      - name: Publish APK as free prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="my-airpods5-v112-lab-r${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* --title "My AirPods5 v1.0.12 isolated case sound research" --notes "Side-by-side package com.myairpods5.personal.lab protects verified v1.0.10 r21. Under Settings, user-confirmed GATT probe targets ONLY app-paired owner AirPods and detects FD44 owner sound endpoint. If identified, a SECOND user confirmation permits documented owner play/stop 4 sec. NOT VERIFIED on AirPods5 case; may produce no sound. Original AACP/ANC/BLE and Golden app untouched; lab may compete for Bluetooth, test one app at a time." --prerelease
          echo "Release: $TAG" >> "$GITHUB_STEP_SUMMARY"
